<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lbf datasets</title>
<style>
  :root { --bg: #f8f9fb; --fg: #1d2330; --muted: #5f6b7a; --line: #dde2ea; --accent: #276890; --chip: #e6f0f6; --panel: #fff; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14171c; --fg: #e4e8ee; --muted: #98a2b0; --line: #2c323c; --accent: #6db3dd; --chip: #1f3340; --panel: #1b1f26; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--fg); }
  header { background: var(--accent); color: #fff; padding: 10px 24px; font-weight: 600; }
  main { padding: 16px 24px 40px; }
  h1 { font-size: 22px; margin: 4px 0 2px; }
  .muted { color: var(--muted); }
  #q { width: min(640px, 100%); padding: 8px 10px; font-size: 15px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--fg); margin: 12px 0; }
  #chips { margin-bottom: 10px; }
  .chip { display: inline-block; background: var(--chip); border-radius: 12px; padding: 2px 10px; margin: 0 6px 6px 0; cursor: pointer; }
  .chip::after { content: " \2715"; color: var(--muted); }
  #facets { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 4px 24px; margin-bottom: 16px; }
  #extra { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 4px 24px; }
  summary { cursor: pointer; margin: 8px 0; }
  #facets h3 { font-size: 14px; margin: 8px 0 4px; }
  #facets ul { list-style: none; padding: 0; margin: 0; }
  #facets li { cursor: pointer; color: var(--accent); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #facets li span { color: var(--muted); margin-left: 4px; }
  #facets li.on { font-weight: 700; }
  .tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); }
  table { border-collapse: collapse; width: 100%; }
  th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--line); vertical-align: top; white-space: nowrap; max-width: 360px; overflow: hidden; text-overflow: ellipsis; }
  th { cursor: pointer; user-select: none; position: sticky; top: 0; background: var(--panel); }
  tbody tr { cursor: pointer; }
  tbody tr:hover { background: var(--chip); }
  td.num { text-align: right; }
  #more { margin-top: 10px; }
  button { font: inherit; padding: 4px 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--fg); cursor: pointer; }
  dialog { width: min(900px, 94vw); max-height: 88vh; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--fg); padding: 20px 24px; }
  dialog::backdrop { background: rgb(0 0 0 / .35); }
  dialog h2 { margin: 0 0 12px; font-size: 18px; word-break: break-all; }
  dl { display: grid; grid-template-columns: max-content 1fr; gap: 4px 16px; margin: 0 0 16px; }
  dt { color: var(--muted); }
  dd { margin: 0; word-break: break-all; }
  .fetch { display: flex; gap: 8px; align-items: center; margin: 0 0 16px; }
  .fetch code { flex: 1; padding: 6px 10px; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; overflow-x: auto; white-space: nowrap; }
  #files td { max-width: 560px; }
  dialog h3 { margin: 20px 0 8px; font-size: 15px; border-top: 1px solid var(--line); padding-top: 14px; }
  dialog ul { margin: 0 0 8px; padding-left: 20px; }
  dialog a, dt a { color: var(--accent); }
  dt a { color: var(--muted); text-decoration: none; }
  dt a:hover { text-decoration: underline; }
</style>
</head>
<body>
<header>lbf datasets</header>
<main>
  <h1 id="title">Loading...</h1>
  <div class="muted" id="summary"></div>
  <input id="q" type="search" placeholder="Search every field, e.g. a person, pipeline, sample or ID" autofocus>
  <div id="chips"></div>
  <div id="facets"></div>
  <div class="tablewrap"><table><thead id="head"></thead><tbody id="rows"></tbody></table></div>
  <div id="more"></div>
</main>
<dialog id="detail"></dialog>
<script>
const LEAD = ["id", "name", "container", "creator", "datePublished", "files", "size_bytes", "run_instrument", "isBasedOn", "wasDerivedFrom"];
const HIDDEN = new Set(["fetch", "description", "name", "identifier", "license", "distribution"]);
const PAGE = 100;
let all = [], files = {}, labels = {}, columns = [], facetCols = [], byId = new Map();
const state = { q: "", filters: {}, sort: "datePublished", desc: true, shown: PAGE };

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const size = n => { const u = ["B", "KB", "MB", "GB", "TB"]; let i = 0; while (n >= 1024 && i < 4) { n /= 1024; i++; } return (i ? n.toFixed(1) : n) + " " + u[i]; };
const when = v => /^\d{4}-\d\d-\d\dT/.test(v) ? v.replace("T", " ").replace(/\.\d+/, "").replace(/Z$/, " UTC").replace(/([+-]\d\d:\d\d)$/, " $1") : v;
const isURL = v => /^(https?:|mailto:)/.test(String(v));
const short = v => String(v).split(", ").map(x => {
  const m = x.match(/^https:\/\/github\.com\/[^/]+\/[^/]+\/tree\/[^/]+\/profiles\/(.+)$/) || x.match(/^https?:\/\/(?:w3id\.org\/|schema\.org\/)(.+)$/);
  return m ? m[1] : x.replace(/^mailto:/, "");
}).join(", ");
const display = x => labels[x] ?? short(when(String(x)));
const vals = v => v === undefined || v === "" ? [] : [].concat(v).map(display);
const show = (col, v) => col === "size_bytes" ? size(v) : typeof v === "number" ? v : vals(v).join(", ");
const decode = p => { try { return decodeURIComponent(p); } catch { return p; } };
const label = col => col === "size_bytes" ? "size" : col;

fetch("catalogue.json").then(r => r.json()).then(cat => {
  all = cat.datasets; files = cat.files; labels = cat.labels || {};
  all.forEach(r => byId.set(r.id, r));
  const seen = new Set(); all.forEach(r => Object.keys(r).forEach(k => seen.add(k)));
  columns = [...LEAD.filter(c => seen.has(c)), ...[...seen].filter(c => !LEAD.includes(c) && !HIDDEN.has(c)).sort()];
  const filled = c => all.filter(r => vals(r[c]).length).length;
  const distinct = c => new Set(all.flatMap(r => vals(r[c]))).size;
  facetCols = columns.filter(c => !["id", "files", "size_bytes", "datePublished"].includes(c) && distinct(c) >= 1 && distinct(c) <= 30 && filled(c) >= 2)
    .sort((a, b) => (distinct(b) > 1) - (distinct(a) > 1) || filled(b) - filled(a));
  $("title").textContent = "Datasets";
  render();
  const r = all.find(r => "#" + r.container + "/" + r.id === decodeURIComponent(location.hash));
  if (r) open(r);
});

function matches(r) {
  for (const [c, v] of Object.entries(state.filters)) if (!vals(r[c]).includes(v)) return false;
  if (!state.q) return true;
  const words = state.q.toLowerCase().split(/\s+/).filter(Boolean);
  const hay = Object.values(r).flat().map(x => x + " " + display(x)).join(" ").toLowerCase() + " " + (files[r.container + "/" + r.id] || []).map(f => f.path).join(" ").toLowerCase();
  return words.every(w => hay.includes(w));
}

function render() {
  const rows = all.filter(matches);
  const { sort, desc } = state;
  rows.sort((a, b) => {
    const x = a[sort], y = b[sort];
    const cmp = typeof x === "number" && typeof y === "number" ? x - y : String(x ?? "").localeCompare(String(y ?? ""), undefined, { numeric: true });
    return desc ? -cmp : cmp;
  });
  const bytes = rows.reduce((s, r) => s + (r.size_bytes || 0), 0);
  $("summary").textContent = `${rows.length} of ${all.length} datasets, ${size(bytes)} in total`;

  $("chips").innerHTML = Object.entries(state.filters).map(([c, v]) => `<span class="chip" data-c="${esc(c)}">${esc(label(c))}: ${esc(v)}</span>`).join("");
  $("chips").querySelectorAll(".chip").forEach(el => el.onclick = () => { delete state.filters[el.dataset.c]; state.shown = PAGE; render(); });

  const facet = c => {
    const counts = {};
    rows.forEach(r => vals(r[c]).forEach(v => counts[v] = (counts[v] || 0) + 1));
    const top = Object.entries(counts).sort((a, b) => b[1] - a[1]).slice(0, 8);
    if (!top.length) return "";
    return `<div><h3>${esc(label(c))}</h3><ul>${top.map(([v, n]) =>
      `<li class="${state.filters[c] === v ? "on" : ""}" data-c="${esc(c)}" data-v="${esc(v)}" title="${esc(v)}">${esc(v)}<span>${n}</span></li>`).join("")}</ul></div>`;
  };
  const extra = facetCols.slice(6).map(facet).join("");
  $("facets").innerHTML = facetCols.slice(0, 6).map(facet).join("") +
    (extra ? `<details style="grid-column: 1 / -1"${state.more ? " open" : ""}><summary class="muted">More filters</summary><div id="extra">${extra}</div></details>` : "");
  const det = $("facets").querySelector("details");
  if (det) det.ontoggle = () => state.more = det.open;
  $("facets").querySelectorAll("li").forEach(el => el.onclick = () => {
    const { c, v } = el.dataset;
    if (state.filters[c] === v) delete state.filters[c]; else state.filters[c] = v;
    state.shown = PAGE; render();
  });

  $("head").innerHTML = "<tr>" + columns.map(c => `<th data-c="${esc(c)}">${esc(label(c))}${c === sort ? (desc ? " ▼" : " ▲") : ""}</th>`).join("") + "</tr>";
  $("head").querySelectorAll("th").forEach(el => el.onclick = () => {
    const c = el.dataset.c; state.desc = state.sort === c ? !state.desc : c !== "id"; state.sort = c; render();
  });

  $("rows").innerHTML = rows.slice(0, state.shown).map((r, i) => "<tr data-i=\"" + i + "\">" + columns.map(c =>
    `<td class="${typeof r[c] === "number" ? "num" : ""}" title="${esc(vals(r[c]).join(", "))}">${esc(show(c, r[c]))}</td>`).join("") + "</tr>").join("");
  $("rows").querySelectorAll("tr").forEach(el => el.onclick = () => open(rows[el.dataset.i]));

  $("more").innerHTML = rows.length > state.shown ? `<button>Show ${Math.min(PAGE, rows.length - state.shown)} more</button>` : "";
  const more = $("more").querySelector("button");
  if (more) more.onclick = () => { state.shown += PAGE; render(); };
}

const list = v => v == null ? [] : Array.isArray(v) ? v : [v];
const link = (href, html) => `<a href="${esc(href)}" target="_blank" rel="noopener">${html}</a>`;
// Terms the RO-Crate 1.1/1.2 context maps outside schema.org; every other term in it is http://schema.org/<term>.
const RO_TERMS = {"cite-as":"http://www.iana.org/assignments/relation/cite-as","hasFile":"http://pcdm.org/models#hasFile","hasMember":"http://pcdm.org/models#hasMember","input":"https://bioschemas.org/properties/input","output":"https://bioschemas.org/properties/output","wasDerivedFrom":"http://www.w3.org/ns/prov#wasDerivedFrom","importedFrom":"http://purl.org/pav/importedFrom","importedOn":"http://purl.org/pav/importedOn","importedBy":"http://purl.org/pav/importedBy","retrievedFrom":"http://purl.org/pav/retrievedFrom","retrievedOn":"http://purl.org/pav/retrievedOn","retrievedBy":"http://purl.org/pav/retrievedBy","conformsTo":"http://purl.org/dc/terms/conformsTo","hasArtifact":"http://www.w3.org/ns/dx/prof/hasArtifact","hasResource":"http://www.w3.org/ns/dx/prof/hasResource","hasRole":"http://www.w3.org/ns/dx/prof/hasRole","hasToken":"http://www.w3.org/ns/dx/prof/hasToken","isProfileOf":"http://www.w3.org/ns/dx/prof/isProfileOf","softwareSuggestions":"https://codemeta.github.io/terms/softwareSuggestions","continuousIntegration":"https://codemeta.github.io/terms/continuousIntegration","buildInstructions":"https://codemeta.github.io/terms/buildInstructions","developmentStatus":"https://codemeta.github.io/terms/developmentStatus","embargoEndDate":"https://codemeta.github.io/terms/embargoEndDate","readme":"https://codemeta.github.io/terms/readme","issueTracker":"https://codemeta.github.io/terms/issueTracker","referencePublication":"https://codemeta.github.io/terms/referencePublication","hasSourceCode":"https://codemeta.github.io/terms/hasSourceCode","isSourceCodeOf":"https://codemeta.github.io/terms/isSourceCodeOf","asWKT":"http://www.opengis.net/ont/geosparql#asWKT","localPath":"https://w3id.org/ro/terms#localPath"};
const RO_PREFIXES = {"pcdm":"http://pcdm.org/models#","bibo":"http://purl.org/ontology/bibo/","cc":"http://creativecommons.org/ns#","dct":"http://purl.org/dc/terms/","foaf":"http://xmlns.com/foaf/0.1/","rdf":"http://www.w3.org/1999/02/22-rdf-syntax-ns#","rdfa":"http://www.w3.org/ns/rdfa#","rdfs":"http://www.w3.org/2000/01/rdf-schema#","frapo":"http://purl.org/cerif/frapo/","rel":"https://www.w3.org/ns/iana/link-relations/relation#","pav":"http://purl.org/pav/","prov":"http://www.w3.org/ns/prov#","wfdesc":"http://purl.org/ro/wfdesc#","wfprov":"http://purl.org/ro/wfprov#","roterms":"http://purl.org/ro/roterms#","wf4ever":"http://purl.org/ro/wf4ever#","prof":"http://www.w3.org/ns/dx/prof/","profrole":"http://www.w3.org/ns/dx/prof/role/","relation":"http://www.iana.org/assignments/relation/","vann":"http://purl.org/vocab/vann/","geosparql":"http://www.opengis.net/ont/geosparql#"};
let crateTerms = {};
const iri = k => {
  const local = crateTerms[k] ?? RO_TERMS[k];
  if (typeof local === "string" || local?.["@id"]) return String(local["@id"] ?? local);
  const [prefix, rest] = k.split(":");
  if (rest !== undefined && (crateTerms[prefix] ?? RO_PREFIXES[prefix])) return (crateTerms[prefix] ?? RO_PREFIXES[prefix]) + rest;
  return isURL(k) ? k : "http://schema.org/" + k;
};
const term = k => k.startsWith("@") ? esc(k) : link(iri(k), esc(k));
const parents = r => [r.isBasedOn, r.wasDerivedFrom, r.run_object].flatMap(v => [].concat(v ?? []).map(String));

async function open(r) {
  history.replaceState(null, "", "#" + r.container + "/" + r.id);
  const crate = await fetch(`crate/${encodeURIComponent(r.container)}/${encodeURIComponent(r.id)}`).then(x => x.json());
  const g = new Map(crate["@graph"].map(e => [e["@id"], e]));
  crateTerms = Object.assign({}, ...list(crate["@context"]).filter(c => typeof c === "object"));
  const rootId = g.get("ro-crate-metadata.json")?.about?.["@id"] ?? "./";
  const root = g.get(rootId);
  const seen = new Set(["ro-crate-metadata.json", rootId]);

  const entity = ref => {
    if (!g.has(ref["@id"]) && !isURL(ref["@id"]) && Object.keys(ref).length === 1)
      return `<span class="muted" title="This crate refers to ${esc(ref["@id"])} but does not describe it">${esc(ref["@id"])} (not described in this crate)</span>`;
    const e = g.get(ref["@id"]) ?? ref;
    seen.add(e["@id"]);
    const name = e.name ?? e.identifier ?? e.value ?? e.contentUrl ?? e["@id"];
    const html = esc(short(when(String(name)))) + (e.version !== undefined ? " " + esc(e.version) : "");
    const ds = byId.get(e.identifier) ?? byId.get(String(name));
    if (ds && list(e["@type"]).includes("Dataset")) return `<a href="#" data-open="${esc(ds.id)}">${html}</a>`;
    const href = [e.url, e.contentUrl, e["@id"]].find(isURL);
    return href ? link(href, html) : html;
  };
  const value = v => list(v).map(x => x && typeof x === "object" && "@id" in x ? entity(x) : isURL(x) ? link(x, esc(short(x))) : esc(when(String(x)))).join(", ");
  const fields = (e, skip) => Object.keys(e).filter(k => !skip.includes(k))
    .map(k => `<dt>${term(k)}</dt><dd>${value(e[k])}</dd>`).join("");
  const section = (title, body) => body ? `<h3>${title}</h3>${body}` : "";

  const runs = [...g.values()].filter(e => list(e["@type"]).includes("CreateAction") && list(e.result).some(x => x?.["@id"] === rootId));
  runs.forEach(e => seen.add(e["@id"]));
  const children = all.filter(c => parents(c).includes(r.id));
  const props = list(root.additionalProperty).map(x => g.get(x["@id"]) ?? x);
  props.forEach(e => seen.add(e["@id"]));
  const parts = list(root.hasPart).map(x => g.get(x["@id"]) ?? x);
  parts.forEach(e => seen.add(e["@id"]));
  const fileKeys = [...new Set(parts.flatMap(Object.keys))].filter(k => !["@id", "@type"].includes(k));
  const from = root.isBasedOn ? "isBasedOn" : "wasDerivedFrom";

  const body = [
    `<dl>${fields(root, ["@id", "hasPart", "additionalProperty", "conformsTo", "isBasedOn", "wasDerivedFrom", "mentions"])}
      <dt>size</dt><dd>${size(r.size_bytes)} in ${r.files} file${r.files === 1 ? "" : "s"}</dd><dt>container</dt><dd>${esc(r.container)}</dd></dl>`,
    section("Produced by", (root[from] ? `<dl><dt>${term(from)}</dt><dd>${value(root[from])}</dd></dl>` : "") +
      runs.map(e => `<dl>${fields(e, ["@id", "@type", "result"])}</dl>`).join("")),
    section("Used to make", children.length ? `<ul>${children.map(c => `<li><a href="#" data-open="${esc(c.id)}">${esc(c.id)}</a> <span class="muted">${esc(show("", c.run_instrument))}</span></li>`).join("")}</ul>` : ""),
    section(term("additionalProperty"), props.length ? `<dl>${props.map(e => `<dt>${esc(e.name ?? e.propertyID ?? e["@id"])}</dt><dd>${e.name ?? e.propertyID ? value(e.value) : `<span class="muted">not described in this crate</span>`}${Object.keys(e).filter(k => !["@id", "@type", "name", "value"].includes(k)).map(k => ` <span class="muted">${term(k)}: ${value(e[k])}</span>`).join("")}</dd>`).join("")}</dl>` : ""),
    section(term("conformsTo"), root.conformsTo ? `<ul>${list(root.conformsTo).map(x => `<li>${entity(x)}</li>`).join("")}</ul>` : ""),
    section(`${term("hasPart")} (${parts.length})`, parts.length ? `<div class="tablewrap"><table id="files"><thead><tr><th>@id</th><th>@type</th>${fileKeys.map(k => `<th>${term(k)}</th>`).join("")}</tr></thead><tbody>
      ${parts.slice(0, 1000).map(f => `<tr><td title="${esc(f["@id"])}">${esc(decode(f["@id"]))}</td><td>${esc(list(f["@type"]).join(", "))}</td>${fileKeys.map(k =>
        `<td class="${k === "contentSize" ? "num" : ""}" title="${esc(f[k] ?? "")}">${k === "contentSize" && f[k] !== undefined ? size(+f[k]) : k === "sha256" ? esc(String(f[k] ?? "").slice(0, 12)) : value(f[k])}</td>`).join("")}</tr>`).join("")}
    </tbody></table></div>${parts.length > 1000 ? `<p class="muted">Showing the first 1000.</p>` : ""}` : ""),
  ];
  const rest = [...g.values()].filter(e => !seen.has(e["@id"]));
  body.push(section("Other entities in this crate", rest.map(e => `<dl><dt>@id</dt><dd>${value(e["@id"])}</dd>${fields(e, ["@id"])}</dl>`).join("")));
  body.push(`<p class="muted">${link(`crate/${encodeURIComponent(r.container)}/${encodeURIComponent(r.id)}`, "View the full ro-crate-metadata.json")}</p>`);

  $("detail").innerHTML = `
    <h2>${esc(r.id)}</h2>
    <div class="fetch"><code>${esc(r.fetch)}</code><button id="copy">Copy</button><button id="close">Close</button></div>
    ${body.join("")}`;
  $("copy").onclick = e => navigator.clipboard.writeText(r.fetch).then(() => e.target.textContent = "Copied");
  $("close").onclick = () => $("detail").close();
  $("detail").querySelectorAll("[data-open]").forEach(a => a.onclick = e => { e.preventDefault(); open(byId.get(a.dataset.open)); });
  if (!$("detail").open) $("detail").showModal();
  $("detail").scrollTop = 0;
}

$("detail").addEventListener("close", () => history.replaceState(null, "", location.pathname));
$("q").addEventListener("input", e => { state.q = e.target.value.trim(); state.shown = PAGE; render(); });
</script>
</body>
</html>
