name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx -y -p azurite@3.37.0 azurite-blob --inMemoryPersistence --skipApiVersionCheck --silent &
      - run: npx -y wait-on@9.5.1 -t 60000 tcp:127.0.0.1:10000
      - run: go test ./...
        env:
          LBF_AZURITE: "1"

  test-native:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
