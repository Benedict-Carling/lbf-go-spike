name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...

  # macOS needs cgo for the Keychain-backed login cache, so it builds on a Mac.
  build-macos:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: |
          for arch in arm64 amd64; do
            CGO_ENABLED=1 GOOS=darwin GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" -o dist/lbf-darwin-$arch .
          done
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/

  build-other:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: |
          for target in linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            os=${target%/*}; arch=${target#*/}; ext=""
            [ "$os" = windows ] && ext=.exe
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" -o dist/lbf-$os-$arch$ext .
          done
      - uses: actions/upload-artifact@v4
        with:
          name: other
          path: dist/

  publish:
    needs: [build-macos, build-other]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp install.ps1 install.sh dist/
          (cd dist && sha256sum * > SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
