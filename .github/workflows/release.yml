name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # No Go cache: a job that runs npm code must not save what the build jobs restore.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx -y -p azurite@3.37.0 azurite-blob --inMemoryPersistence --skipApiVersionCheck --silent &
      - run: npx -y wait-on@9.5.1 -t 60000 tcp:127.0.0.1:10000
      - run: go test ./...
        env:
          LBF_AZURITE: "1"

  # The Keychain and Windows credential store code, and Windows self-replacement, only run here.
  test-native:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...

  # macOS needs cgo for the Keychain-backed login cache, so it builds on a Mac.
  build-macos:
    needs: [test, test-native]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: |
          for arch in arm64 amd64; do
            CGO_ENABLED=1 GOOS=darwin GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" -o dist/lbf-darwin-$arch .
          done
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/

  build-other:
    needs: [test, test-native]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: |
          for target in linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            os=${target%/*}; arch=${target#*/}; ext=""
            [ "$os" = windows ] && ext=.exe
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" -o "dist/lbf-$os-$arch$ext" .
          done
      - uses: actions/upload-artifact@v4
        with:
          name: other
          path: dist/

  # Runs the very files the release will carry, on each runner that can.
  smoke:
    needs: [build-macos, build-other]
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            bin: lbf-linux-amd64
          - os: windows-latest
            bin: lbf-windows-amd64.exe
          - os: macos-latest
            bin: lbf-darwin-arm64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      LBF_NO_UPDATE_CHECK: "1"
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: |
          chmod +x dist/lbf-*
          got=$("dist/${{ matrix.bin }}" version)
          echo "$got"
          [ "$got" = "lbf $GITHUB_REF_NAME" ]
      - if: runner.os == 'macOS'
        run: |
          if arch -x86_64 /usr/bin/true 2>/dev/null; then
            got=$(arch -x86_64 dist/lbf-darwin-amd64 version)
            echo "$got"
            [ "$got" = "lbf $GITHUB_REF_NAME" ]
          else
            echo "::warning::Rosetta is not installed, so lbf-darwin-amd64 was not run"
          fi

  publish:
    needs: smoke
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp scripts/install.ps1 scripts/install.sh dist/
          (cd dist && sha256sum -- * > SHA256SUMS)
          # A pre-release never becomes latest, which is what the installers and lbf upgrade fetch.
          prerelease=""
          case $GITHUB_REF_NAME in *-*) prerelease=--prerelease ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes $prerelease
