name: install-check

on:
  workflow_dispatch:

jobs:
  windows:
    strategy:
      matrix:
        # powershell is Windows PowerShell 5.1, what the Start menu opens; pwsh is PowerShell 7.
        shell: [powershell, pwsh]
    runs-on: windows-latest
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - run: |
          $PSVersionTable.PSVersion.ToString()
          irm https://github.com/Benedict-Carling/lbf-go-spike/releases/latest/download/install.ps1 | iex
          lbf version
          lbf help

  unix:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - run: |
          curl -fsSL https://github.com/Benedict-Carling/lbf-go-spike/releases/latest/download/install.sh | sh
          ~/.local/bin/lbf version
